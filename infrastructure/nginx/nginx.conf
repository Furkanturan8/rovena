worker_processes auto;

events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s;   # Docker DNS; lets nginx start before upstreams exist
    server_tokens off;
    client_max_body_size 1m;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    map $http_x_request_id $request_id_out {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 80;

        add_header X-Content-Type-Options nosniff always;

        location = /healthz { access_log off; return 200 "ok\n"; }

        # Identity: auth + user management
        location ~ ^/api/v1/(auth|users)(/|$) {
            limit_req zone=api burst=60 nodelay;
            set $identity http://identity:8081;
            proxy_pass $identity;
            include /etc/nginx/proxy_params.conf;
        }

        # Further services (catalog, inventory, order, payment) are routed here as they are added.

        location / { return 404; }
    }
}
