name: rovena

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692" # Prometheus metrics (rabbitmq_prometheus plugin)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-migrate:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    entrypoint: ["/app/migrate", "-action", "up"]
    environment:
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD}@postgres:5432/identity?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      APP_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      HTTP_PORT: "8081"
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD}@postgres:5432/identity?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8081"

  identity-seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    entrypoint: ["/app/seed"]
    environment:
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD}@postgres:5432/identity?sslmode=disable
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
    depends_on:
      identity-migrate:
        condition: service_completed_successfully

  catalog-migrate:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    entrypoint: ["/app/migrate", "-action", "up"]
    environment:
      DATABASE_URL: postgres://catalog:${CATALOG_DB_PASSWORD}@postgres:5432/catalog?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      APP_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      HTTP_PORT: "8082"
      DATABASE_URL: postgres://catalog:${CATALOG_DB_PASSWORD}@postgres:5432/catalog?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8082:8082"

  catalog-seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    entrypoint: ["/app/seed"]
    environment:
      DATABASE_URL: postgres://catalog:${CATALOG_DB_PASSWORD}@postgres:5432/catalog?sslmode=disable
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully

  inventory-migrate:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    entrypoint: ["/app/migrate", "-action", "up"]
    environment:
      DATABASE_URL: postgres://inventory:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    environment:
      APP_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      HTTP_PORT: "8083"
      DATABASE_URL: postgres://inventory:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      RESERVATION_TTL: 15m
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8083:8083"

  inventory-seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    entrypoint: ["/app/seed"]
    environment:
      DATABASE_URL: postgres://inventory:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory?sslmode=disable
      CATALOG_BASE_URL: http://catalog:8082
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
      catalog:
        condition: service_started

  payment-migrate:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    entrypoint: ["/app/migrate", "-action", "up"]
    environment:
      DATABASE_URL: postgres://payment:${PAYMENT_DB_PASSWORD}@postgres:5432/payment?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Consumes PaymentRequested from RabbitMQ and publishes PaymentSucceeded/PaymentFailed.
  # The HTTP port serves read endpoints only; there is no way to create a payment over HTTP.
  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    environment:
      APP_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      HTTP_PORT: "8085"
      DATABASE_URL: postgres://payment:${PAYMENT_DB_PASSWORD}@postgres:5432/payment?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      PAYMENT_MAX_ATTEMPTS: "3"
      OUTBOX_RETENTION: 168h
      PAYMENT_CHARGE_TIMEOUT: 10s
      PAYMENT_RETRY_DELAY: 5s
      FAKE_PROVIDER_LATENCY: 300ms
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8085"

  order-migrate:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    entrypoint: ["/app/migrate", "-action", "up"]
    environment:
      DATABASE_URL: postgres://orders:${ORDER_DB_PASSWORD}@postgres:5432/orders?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Carts, checkout and the saga. Reserves stock in Inventory over REST, asks Payment over
  # RabbitMQ, and repairs orders that get stuck (see ORDER_* settings).
  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    environment:
      APP_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      HTTP_PORT: "8086"
      DATABASE_URL: postgres://orders:${ORDER_DB_PASSWORD}@postgres:5432/orders?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      CATALOG_URL: http://catalog:8082
      INVENTORY_URL: http://inventory:8083
      ORDER_RECOVERY_INTERVAL: 15s
      OUTBOX_RETENTION: 168h
      ORDER_STUCK_AFTER: 30s
      ORDER_PAYMENT_TIMEOUT: 2m
      ORDER_MAX_PAYMENT_REQUESTS: "3"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_started
      inventory:
        condition: service_started
    ports:
      - "127.0.0.1:8086:8086"

  # Traces: UI on http://localhost:16686. In-memory storage, traces are gone after a restart.
  jaeger:
    image: jaegertracing/jaeger:2.4.0
    ports:
      - "127.0.0.1:16686:16686"

  # Metrics: UI on http://localhost:9090 (try `rate(http_server_request_duration_seconds_count[1m])`).
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - rabbitmq

  # Dashboards: http://localhost:3000 (no login in this development setup). The "Rovena overview"
  # dashboard is provisioned from infrastructure/grafana; edit the JSON file, not the UI.
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - identity
      - catalog
      - inventory
      - payment
      - order

volumes:
  postgres-data:
  rabbitmq-data:
