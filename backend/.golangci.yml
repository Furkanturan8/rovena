version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose            # unclosed HTTP response bodies (the Order service has HTTP clients)
    - errorlint            # errors.Is/As instead of == and type assertions
    - misspell
    - unconvert
    - copyloopvar
  exclusions:
    rules:
      # Tests clean up with best-effort calls and fail loudly elsewhere.
      - path: _test\.go
        linters: [errcheck, errorlint]

formatters:
  enable:
    - gofmt
