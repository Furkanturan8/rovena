worker_processes auto;

events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s;   # Docker DNS; lets nginx start before upstreams exist
    server_tokens off;
    client_max_body_size 1m;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    map $http_x_request_id $request_id_out {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 80;

        add_header X-Content-Type-Options nosniff always;

        # limit_req answers 503 by default, which reads like an outage. Say what happened,
        # in the same JSON envelope the services use.
        limit_req_status 429;
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"success":false,"message":"Too many requests, try again later"}';
        }

        location = /healthz { access_log off; return 200 "ok\n"; }

        # Identity: auth + user management
        location ~ ^/api/v1/(auth|users)(/|$) {
            limit_req zone=api burst=60 nodelay;
            set $identity http://identity:8081;
            proxy_pass $identity;
            include /etc/nginx/proxy_params.conf;
        }

        # Catalog: public storefront reads + admin management
        location ~ ^/api/v1/(products|categories|admin/(products|categories))(/|$) {
            limit_req zone=api burst=60 nodelay;
            set $catalog http://catalog:8082;
            proxy_pass $catalog;
            include /etc/nginx/proxy_params.conf;
        }

        # Inventory: public availability + admin stock management.
        # /api/v1/internal/* is deliberately not routed: reservations are a
        # service-to-service API and must not be reachable from the internet.
        location ~ ^/api/v1/(stock|admin/stock)(/|$) {
            limit_req zone=api burst=60 nodelay;
            set $inventory http://inventory:8083;
            proxy_pass $inventory;
            include /etc/nginx/proxy_params.conf;
        }

        # Payment: a customer reads the state of their own payment; admins list payments.
        # /api/v1/internal/* is not routed, as for Inventory. Payments are created only
        # by PaymentRequested events, so there is no public write endpoint to expose.
        location ~ ^/api/v1/(payments|admin/payments)(/|$) {
            limit_req zone=api burst=60 nodelay;
            set $payment http://payment:8085;
            proxy_pass $payment;
            include /etc/nginx/proxy_params.conf;
        }

        # Order: cart, checkout and the customer's own orders; admins list all orders.
        # The Idempotency-Key header passes through unchanged. Checkout is the one place
        # where a request waits on another service (Inventory), hence the stricter limit.
        location = /api/v1/checkout {
            limit_req zone=api burst=10 nodelay;
            set $order http://order:8086;
            proxy_pass $order;
            include /etc/nginx/proxy_params.conf;
        }

        location ~ ^/api/v1/(cart|orders|admin/orders)(/|$) {
            limit_req zone=api burst=60 nodelay;
            set $order http://order:8086;
            proxy_pass $order;
            include /etc/nginx/proxy_params.conf;
        }

        location / { return 404; }
    }
}
